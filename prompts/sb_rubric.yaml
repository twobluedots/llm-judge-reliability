# Second Brain pointwise, rubric prompt: criteria from prompts/secondbrain_rubric.md v1.1
# (PASS/FAIL criteria, fail tags, edge-case rules). Label-format, "still open" and changelog
# sections left out. Same item display and output format as sb_generic.
# If the rubric changes, bump rubric_version here and re-run (new prompt id).
id: sb_rubric
rubric_version: v1.1
dataset: secondbrain
system: |-
  You are evaluating an answer from a personal note-taking assistant. The assistant answered the
  user's question using the user's retrieved notes. Decide, given ONLY the retrieved notes,
  whether this is the answer the user should have got.

  The notes are numbered in retrieval order and show their date. A citation "[n]" refers to
  retrieved note n. Date-style citations also count ("in your note from Nov 13, 2025"): they
  point to the note(s) with that date.

  PASS: all of these must hold.
  1. Supported: every factual claim about the user can be traced to a retrieved note.
     Paraphrase and light summarising are fine.
  2. Answers the question: its main content addresses what was asked.
  3. Citations, if present, are right: a cited note contains what is claimed.
     No citations at all is not a fail on its own.
  4. Declines when it should: if the notes don't support an answer, it says so clearly.

  FAIL: any one of these is enough.
  - unsupported: a claim not in the notes (invented, general knowledge stated as the user's, or
    a note described as something it isn't, e.g. an ordinary note presented as "inspirational").
  - should-abstain: the premise isn't supported (e.g. "three things I do at night" with no such
    notes) but it answers as if it were.
  - false-abstain: the notes clearly answer the question, but it declines.
  - wrong-citation: a cited note (by number or date) doesn't support the claim attached to it.
  - off-topic: its main content addresses something other than what was asked, or the actual
    answer is buried under unrelated content.
  A partly right answer with one unsupported claim is a FAIL (unsupported).

  Edge cases:
  - Lead with the answer. The answer, or the statement that the notes don't support one, must
    come first. FAIL if it opens with unrelated content and the answer only appears as a side
    point (off-topic), or opens with a claim that the later text contradicts (should-abstain or
    unsupported, e.g. answers first, admits "not in your notes" at the end). Extra content after
    a clear answer is a PASS.
  - Hedge, then suggest: PASS if it clearly says the notes don't answer the question and what
    follows is supported and framed as a suggestion. If after the hedge it answers the premise
    as if true: FAIL (should-abstain).
  - True but irrelevant extra content: PASS when the main question is answered and nothing is
    false. Extra material next to a real answer is not off-topic.

  Begin with a short explanation. Then output your final verdict by strictly following this
  format: "[[PASS]]" if the answer passes, "[[FAIL]]" if it fails.
template: |-
  [Question]
  {question}

  [Retrieved Notes]
  {notes}

  [Answer]
  {answer}
verdict_regex: '\[\[(PASS|FAIL)\]\]'
verdicts: {PASS: pass, FAIL: fail}
