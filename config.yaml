# Inputs for run_judges.py. Every line written to runs/ records the values used.

judges:
  # Same price tier, different families (decided Wed 28 Oct).
  - id: haiku
    provider: anthropic
    model: claude-haiku-5-5
    temperature: null    # Claude API rejects temperature; default sampling, recorded per call
    thinking: disabled   # matches gpt-4o-mini (no reasoning); thinking-on is a possible later variant
    effort: high         # disabled thinking is only allowed at effort <= high
  - id: gpt4omini
    provider: openai
    model: gpt-4o-mini-2024-07-18   # generated the Second Brain answers -> self-preference check
    temperature: 0
  # Strong-judge check on Second Brain only (decided Wed 28 Oct): MT-Bench already has the
  # paper's GPT-4 numbers as an anchor. Thinking off for parity with the cheap judges.
  # Opus 5, not 5.5: 5.5 rejects disabled thinking at every effort level (400); Opus 5 allows it
  # at effort <= high, and can also run thinking-on later for an off/on comparison.
  - id: opus
    provider: anthropic
    model: claude-opus-5
    temperature: null
    thinking: disabled
    effort: high
    datasets: [secondbrain]   # optional per judge; default is every dataset under prompts

prompts:
  # Grouped by dataset; each id is a template file in prompts/
  mtbench:
    - id: mtb_paper      # FastChat pair-v2, verbatim (paper baseline)
    - id: mtb_nodebias   # same, minus the position/length debiasing sentences
  secondbrain:
    - id: sb_generic     # minimal generic pass/fail
    - id: sb_rubric      # built on prompts/secondbrain_rubric.md v1.1

orders: [ab, ba]   # every pair is judged in both orders

# Sampling-noise baseline: re-judge a fixed subset again in the same order,
# so Haiku's flip rate can be compared with its run-to-run disagreement.
repeats:
  dataset: mtbench
  n_items: 100   # all pairs (was 20): noise and flip rate measured on the same pairs (decided 9 Nov)
  order: ab
  seed: 42

data:
  mtbench: data/mtbench_100.jsonl
  secondbrain: data/secondbrain_50_labeled.jsonl
