[project]
name = "llm-judge-reliability"
version = "0.1.0"
description = "How far can you trust an LLM judge, and when does it fail?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "datasets>=5.1.0",
    "openai>=3.40.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
